name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: lint + test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Ruff lint
        run: uv run ruff check src/ tests/ app/

      - name: Pytest (full suite, replay mode)
        env:
          AUTOSIGNALX_REPLAY: "true"
        run: uv run pytest -q --tb=short

      - name: Smoke build of the static cockpit snapshot
        run: uv run autosignalx snapshot build

      - name: Upload snapshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-snapshot
          path: reports/cockpit_snapshot/
          if-no-files-found: ignore
          retention-days: 7
